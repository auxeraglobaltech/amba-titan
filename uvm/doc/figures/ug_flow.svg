<svg class="fig-svg" viewBox="0 0 1100 250" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif">
<defs><marker id="ugf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f3a5f"/></marker></defs>
<g font-size="12" fill="#1b2430">
<text x="20" y="28" font-size="12.5" font-weight="700">uvm/sim/run.sh my_test</text>
<rect x="20" y="50" width="170" height="78" rx="3" fill="#fff" stroke="#3b5b84"/><text x="105" y="72" text-anchor="middle" font-weight="700">1 · tests.list</text><text x="105" y="92" text-anchor="middle" font-size="11">my_test → UVM test</text><text x="105" y="108" text-anchor="middle" font-size="11">+ firmware name</text>
<rect x="225" y="50" width="190" height="78" rx="3" fill="#fff" stroke="#3b5b84"/><text x="320" y="72" text-anchor="middle" font-weight="700">2 · firmware</text><text x="320" y="92" text-anchor="middle" font-size="11">make -C firmware TEST=&lt;fw&gt;</text><text x="320" y="108" text-anchor="middle" font-size="11">→ build/&lt;fw&gt;/&lt;fw&gt;.hex</text>
<rect x="450" y="50" width="190" height="78" rx="3" fill="#fff" stroke="#3b5b84"/><text x="545" y="72" text-anchor="middle" font-weight="700">3 · build</text><text x="545" y="92" text-anchor="middle" font-size="11">xrun -elaborate (incremental)</text><text x="545" y="108" text-anchor="middle" font-size="11">rtl.f + uvm.f → snapshot tb</text>
<rect x="675" y="50" width="190" height="78" rx="3" fill="#fff" stroke="#3b5b84"/><text x="770" y="72" text-anchor="middle" font-weight="700">4 · simulate</text><text x="770" y="92" text-anchor="middle" font-size="11">+UVM_TESTNAME +firmware</text><text x="770" y="108" text-anchor="middle" font-size="11">+otp → runs/my_test/run.log</text>
<rect x="900" y="50" width="180" height="78" rx="3" fill="#e7f1ee" stroke="#2f7566"/><text x="990" y="72" text-anchor="middle" font-weight="700" fill="#2f7566">5 · result</text><text x="990" y="92" text-anchor="middle" font-size="11">*** TEST PASSED ***</text><text x="990" y="108" text-anchor="middle" font-size="11">RESULT: PASSED</text>
<g stroke="#1f3a5f" stroke-width="1.6" marker-end="url(#ugf)"><line x1="190" y1="89" x2="223" y2="89"/><line x1="415" y1="89" x2="448" y2="89"/><line x1="640" y1="89" x2="673" y2="89"/><line x1="865" y1="89" x2="898" y2="89"/></g>
<text x="20" y="160" font-size="12.5" font-weight="700">Inside step 4 (every test)</text>
<g font-size="11">
<rect x="20" y="172" width="1060" height="58" rx="3" fill="#e9eef5" stroke="#9fb3cc"/>
<text x="34" y="194">POR → AST, OTP, life cycle (~2.2 ms) → crt0: PMP, clocks, SRAM → firmware writes IN_TEST → <tspan font-weight="700">your test_body()</tspan> → firmware writes PASSED/FAILED (C tests) → report_phase prints PASSED/FAILED</text>
<text x="34" y="216" fill="#5b6675">Meanwhile, without any code from you: 56 AXI monitors + fabric scoreboard check every bus transaction; AXI handshake assertions run on every port.</text>
</g>
</g>
</svg>
