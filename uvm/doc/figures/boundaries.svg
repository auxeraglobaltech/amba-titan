<text x="500" y="225" font-size="11.5" fill="#5b6675" text-anchor="middle">A peripheral access crosses two crossbars, so boundaries 2 and 3 appear twice (2&#8242;, 3&#8242;). A main-side IP (SRAM, PLIC, hmac) goes 1 &rarr; 2 &rarr; 3 = 4.</text>
