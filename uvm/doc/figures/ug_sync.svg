<svg class="fig-svg" viewBox="0 0 1100 330" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif">
<defs><marker id="ugs" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a07a1c"/></marker></defs>
<g font-size="12" fill="#1b2430">
<rect x="30" y="20" width="300" height="34" rx="3" fill="#1f3a5f"/><text x="180" y="42" text-anchor="middle" fill="#fff" font-weight="700">Firmware (firmware/tests/my_gpio_pulse.c)</text>
<rect x="770" y="20" width="300" height="34" rx="3" fill="#2f7566"/><text x="920" y="42" text-anchor="middle" fill="#fff" font-weight="700">UVM test (my_gpio_pulse_test)</text>
<line x1="180" y1="54" x2="180" y2="315" stroke="#9fb3cc" stroke-width="2"/><line x1="920" y1="54" x2="920" y2="315" stroke="#9cc7bc" stroke-width="2"/>
<rect x="60" y="72" width="240" height="44" rx="3" fill="#fff" stroke="#3b5b84"/><text x="180" y="91" text-anchor="middle" font-size="11">pinmux, GPIO0 output, low</text><text x="180" y="107" text-anchor="middle" font-size="11">titan_sync(1)</text>
<line x1="300" y1="107" x2="788" y2="107" stroke="#a07a1c" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#ugs)"/>
<text x="545" y="99" text-anchor="middle" font-size="11" fill="#a07a1c">AXI write 1 → titan_sim_ctrl SYNC (0x411F_0088) → env.sw.ev_sync</text>
<rect x="790" y="88" width="260" height="38" rx="3" fill="#fff" stroke="#2f7566"/><text x="920" y="111" text-anchor="middle" font-size="11">env.sw.wait_sync(1) returns</text>
<rect x="60" y="140" width="240" height="44" rx="3" fill="#fff" stroke="#3b5b84"/><text x="180" y="159" text-anchor="middle" font-size="11">gpio_write(1); delay_us(10);</text><text x="180" y="175" text-anchor="middle" font-size="11">gpio_write(0)</text>
<line x1="300" y1="162" x2="788" y2="162" stroke="#5b6675" stroke-width="1.2" marker-end="url(#ugs)"/>
<text x="545" y="154" text-anchor="middle" font-size="11" fill="#5b6675">pad IOB0: 10 µs pulse</text>
<rect x="790" y="142" width="260" height="42" rx="3" fill="#fff" stroke="#2f7566"/><text x="920" y="160" text-anchor="middle" font-size="11">wait pins[0] high, then low;</text><text x="920" y="176" text-anchor="middle" font-size="11">measure the width</text>
<rect x="60" y="200" width="240" height="30" rx="3" fill="#fff" stroke="#3b5b84"/><text x="180" y="220" text-anchor="middle" font-size="11">titan_sync(2)</text>
<line x1="300" y1="215" x2="788" y2="215" stroke="#a07a1c" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#ugs)"/>
<rect x="790" y="200" width="260" height="30" rx="3" fill="#fff" stroke="#2f7566"/><text x="920" y="220" text-anchor="middle" font-size="11">env.sw.wait_sync(2); check width</text>
<rect x="60" y="246" width="240" height="30" rx="3" fill="#fff" stroke="#3b5b84"/><text x="180" y="266" text-anchor="middle" font-size="11">return 0 → crt0 writes PASSED</text>
<line x1="300" y1="261" x2="788" y2="261" stroke="#a07a1c" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#ugs)"/>
<rect x="790" y="246" width="260" height="30" rx="3" fill="#fff" stroke="#2f7566"/><text x="920" y="266" text-anchor="middle" font-size="11">super.test_body(): waits for PASSED</text>
<text x="545" y="306" text-anchor="middle" font-size="11" fill="#5b6675">Dashed arrows: firmware → testbench messages (AXI writes to titan_sim_ctrl). The testbench → firmware direction uses pins (GPIO inputs).</text>
</g>
</svg>
