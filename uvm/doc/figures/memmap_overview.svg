<rect x="210" y="60" width="110" height="60" fill="#c9d6e8" stroke="#1f3a5f"/><text x="265" y="85" text-anchor="middle" font-weight="600">main SRAM</text><text x="265" y="101" text-anchor="middle">0x1000_0000</text><text x="265" y="114" text-anchor="middle" fill="#5b6675">128 KiB</text>
