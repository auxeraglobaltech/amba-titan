<text x="20" y="40" font-size="12" fill="#5b6675">low addresses</text><text x="980" y="40" font-size="12" fill="#5b6675" text-anchor="end">high addresses</text>
<line x1="20" y1="48" x2="980" y2="48" stroke="#5b6675" stroke-width="1"/>
<text x="20" y="150" font-size="11.5" fill="#5b6675">Fetch-reachable (corei): ROM, debug ROM, main SRAM, flash. Everything between windows is DECERR.</text>
<text x="20" y="170" font-size="11.5" fill="#a07a1c">Simulation only: titan_sim_ctrl at 0x411F_0080–0x411F_009F (status / log / sync), carved out of rv_core_ibex.cfg.</text>
