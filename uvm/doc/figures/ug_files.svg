<svg class="fig-svg" viewBox="0 0 1100 380" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Consolas, monospace">
<g font-size="12" fill="#1b2430">
<rect x="20" y="20" width="510" height="340" rx="3" fill="#fff" stroke="#c4ccd6"/>
<rect x="570" y="20" width="510" height="340" rx="3" fill="#fff" stroke="#c4ccd6"/>
<text x="36" y="44" font-family="IBM Plex Sans, Arial, sans-serif" font-weight="700" font-size="13" fill="#1f3a5f">firmware/  — the C side</text>
<text x="586" y="44" font-family="IBM Plex Sans, Arial, sans-serif" font-weight="700" font-size="13" fill="#2f7566">uvm/  — the testbench side</text>
<g font-size="11.5">
<text x="40" y="72">firmware/</text>
<text x="56" y="94">tests/<tspan fill="#2e7d32" font-weight="700">my_test.c</tspan></text><text x="300" y="94" font-family="IBM Plex Sans, Arial, sans-serif" fill="#2e7d32">← ADD: one file per test</text>
<text x="56" y="116">lib/drivers.c</text><text x="300" y="116" font-family="IBM Plex Sans, Arial, sans-serif" fill="#8f6430">← EXTEND: a new helper</text>
<text x="56" y="138">include/titan.h</text><text x="300" y="138" font-family="IBM Plex Sans, Arial, sans-serif" fill="#8f6430">← EXTEND: declare it</text>
<text x="56" y="160">include/regs/&lt;ip&gt;_regs.h</text><text x="300" y="160" font-family="IBM Plex Sans, Arial, sans-serif" fill="#5b6675">read only (generated)</text>
<text x="56" y="182">include/top_earlgrey.h</text><text x="300" y="182" font-family="IBM Plex Sans, Arial, sans-serif" fill="#5b6675">read only: base addrs, IRQ ids</text>
<text x="56" y="204">lib/crt0.S, link/rom.ld</text><text x="300" y="204" font-family="IBM Plex Sans, Arial, sans-serif" fill="#5b6675">rarely: boot, memory layout</text>
<text x="56" y="226">build/&lt;fw&gt;/&lt;fw&gt;.{hex,dis,map}</text><text x="300" y="226" font-family="IBM Plex Sans, Arial, sans-serif" fill="#5b6675">output (not committed)</text>
</g>
<g font-size="11.5">
<text x="590" y="72">uvm/</text>
<text x="606" y="94">sim/<tspan fill="#2e7d32" font-weight="700">tests.list</tspan></text><text x="850" y="94" font-family="IBM Plex Sans, Arial, sans-serif" fill="#2e7d32">← ADD: one line per test</text>
<text x="606" y="116">tests/<tspan fill="#2e7d32" font-weight="700">titan_test_pkg.sv</tspan></text><text x="850" y="116" font-family="IBM Plex Sans, Arial, sans-serif" fill="#2e7d32">← ADD: test / sequence class</text>
<text x="606" y="138">TESTS.md</text><text x="850" y="138" font-family="IBM Plex Sans, Arial, sans-serif" fill="#2e7d32">← ADD: describe the test</text>
<text x="606" y="160">agents/&lt;new&gt;_agent/</text><text x="850" y="160" font-family="IBM Plex Sans, Arial, sans-serif" fill="#8f6430">← EXTEND: new pin agent</text>
<text x="606" y="182">tb/tb_top.sv, sim/uvm.f</text><text x="850" y="182" font-family="IBM Plex Sans, Arial, sans-serif" fill="#8f6430">← EXTEND: hook it up</text>
<text x="606" y="204">env/titan_env_pkg.sv</text><text x="850" y="204" font-family="IBM Plex Sans, Arial, sans-serif" fill="#8f6430">← EXTEND: add to the env</text>
<text x="606" y="226">tb/titan_axi_probe.sv, env/titan_addr_map_pkg.sv</text>
<text x="850" y="248" font-family="IBM Plex Sans, Arial, sans-serif" fill="#5b6675">read only (generated)</text>
<text x="606" y="270">sim/runs/&lt;test&gt;/run.log</text><text x="850" y="270" font-family="IBM Plex Sans, Arial, sans-serif" fill="#5b6675">output (not committed)</text>
</g>
<g font-family="IBM Plex Sans, Arial, sans-serif" font-size="11.5">
<rect x="36" y="300" width="14" height="12" fill="#2e7d32"/><text x="58" y="311">add for every new test</text>
<rect x="236" y="300" width="14" height="12" fill="#8f6430"/><text x="258" y="311">extend only when the test needs something new</text>
<rect x="586" y="300" width="14" height="12" fill="#5b6675"/><text x="608" y="311">do not edit (generated, or part of the infrastructure)</text>
<text x="36" y="338" fill="#5b6675">rtl/ and vendor/ are the design: tests never change them.</text>
</g>
</g>
</svg>
