 <rect x="10" y="140" width="160" height="48" rx="6" fill="#fff" stroke="#1b2430"/><text x="90" y="160" text-anchor="middle" font-weight="600">Ibex data</text><text x="90" y="176" text-anchor="middle" fill="#5b6675">rv_core_ibex.cored</text>
 <rect x="10" y="210" width="160" height="48" rx="6" fill="#fff" stroke="#1b2430"/><text x="90" y="230" text-anchor="middle" font-weight="600">Debug (JTAG)</text><text x="90" y="246" text-anchor="middle" fill="#5b6675">rv_dm.sba</text>
 <rect x="10" y="290" width="160" height="48" rx="6" fill="#fdf6e3" stroke="#a07a1c" stroke-dasharray="4 3"/><text x="90" y="310" text-anchor="middle" font-weight="600">UVM AXI master</text><text x="90" y="326" text-anchor="middle" fill="#a07a1c">host.sim_host [sim]</text>
</g>
