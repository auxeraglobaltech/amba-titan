<g stroke="#6b3fa0" stroke-width="2" marker-end="url(#art)"><line x1="995" y1="490" x2="995" y2="545"/></g>
<rect x="930" y="548" width="130" height="34" rx="5" fill="#f6f3fb" stroke="#6b3fa0"/><text x="995" y="569" font-size="11" text-anchor="middle">IPs (TL-UL ports)</text>
<text x="1008" y="520" font-size="10.5" fill="#6b3fa0">TL-UL</text>
<!-- legend -->
<g font-size="11">
 <line x1="20" y1="420" x2="60" y2="420" stroke="#1b2430" stroke-width="2" marker-end="url(#ar)"/><text x="68" y="424">AXI4</text>
 <line x1="20" y1="445" x2="60" y2="445" stroke="#6b3fa0" stroke-width="2" marker-end="url(#art)"/><text x="68" y="449">TL-UL</text>
 <rect x="20" y="462" width="40" height="16" fill="#fdf6e3" stroke="#a07a1c" stroke-dasharray="4 3"/><text x="68" y="475">simulation only (+define+TITAN_SIM)</text>
 <text x="20" y="505" fill="#5b6675">ID at a device port = {host index, host ID}</text>
 <text x="20" y="522" fill="#5b6675">host index: corei 0, cored 1, sba 2, UVM 3</text>
