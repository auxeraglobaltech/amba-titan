<rect x="530" y="140" width="200" height="34" rx="5" fill="#fdf6e3" stroke="#a07a1c" stroke-dasharray="4 3"/><text x="630" y="161" font-size="11" text-anchor="middle">u_sim_ctrl (titan_sim_ctrl) [sim]</text>
<line x1="480" y1="157" x2="528" y2="157" stroke="#1b2430" stroke-width="2" marker-end="url(#ar)"/>
