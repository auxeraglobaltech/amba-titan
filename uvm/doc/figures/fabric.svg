<rect x="530" y="200" width="200" height="34" rx="5" fill="#fff" stroke="#8f6430"/><text x="630" y="221" font-size="11" text-anchor="middle">u_cdc_spi_host0/1, u_cdc_usbdev</text>
<line x1="480" y1="217" x2="528" y2="217" stroke="#1b2430" stroke-width="2" marker-end="url(#ar)"/>
<line x1="730" y1="217" x2="790" y2="140" stroke="#1b2430" stroke-width="2" marker-end="url(#ar)"/>
