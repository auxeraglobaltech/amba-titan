</defs>
<!-- domain backgrounds -->
<rect x="190" y="20" width="560" height="600" rx="10" fill="#e9eef5" stroke="#9fb3cc"/>
<text x="200" y="40" font-size="13" fill="#1f3a5f" font-weight="700">clk_main 100 MHz</text>
<rect x="770" y="300" width="300" height="320" rx="10" fill="#e7f1ee" stroke="#9cc7bc"/>
<text x="780" y="320" font-size="13" fill="#2f7566" font-weight="700">clk_io_div4 24 MHz (xbar_peri side)</text>
