<text x="780" y="40" font-size="13" fill="#8f6430" font-weight="700">own clocks: io 96 / io_div2 48 / usb 48</text>
<text x="545" y="636" font-size="12" fill="#5b6675" text-anchor="middle">F = tb_top.dut.top_earlgrey.u_axi_fabric (everything inside the shaded areas)</text>
