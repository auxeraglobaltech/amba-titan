<rect x="530" y="300" width="200" height="40" rx="5" fill="#fff" stroke="#2f7566" stroke-width="2"/><text x="630" y="318" font-size="12" text-anchor="middle" font-weight="600">axi_cdc  u_cdc_peri</text><text x="630" y="333" font-size="10.5" text-anchor="middle" fill="#5b6675">main_dev_req[4] &rarr; peri_host_req</text>
