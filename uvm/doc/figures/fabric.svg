 <rect x="212" y="144" width="120" height="40" rx="5" fill="#fff" stroke="#1f3a5f"/><text x="272" y="161" text-anchor="middle" font-weight="600">titan_tlul2axi</text><text x="272" y="176" text-anchor="middle" fill="#5b6675">u_host_..cored</text>
 <rect x="212" y="214" width="120" height="40" rx="5" fill="#fff" stroke="#1f3a5f"/><text x="272" y="231" text-anchor="middle" font-weight="600">titan_tlul2axi</text><text x="272" y="246" text-anchor="middle" fill="#5b6675">u_host_rv_dm__sba</text>
