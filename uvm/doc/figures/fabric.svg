<svg class="fig-svg" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif">
<defs>
 <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1b2430"/></marker>
