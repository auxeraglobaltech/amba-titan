<rect x="790" y="350" width="110" height="230" rx="8" fill="#2f7566"/>
<text x="845" y="450" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">axi_xbar</text>
<text x="845" y="468" font-size="13" fill="#fff" text-anchor="middle">peri</text>
<text x="845" y="488" font-size="11" fill="#d3ebe5" text-anchor="middle">u_xbar_peri</text>
<text x="845" y="505" font-size="10.5" fill="#d3ebe5" text-anchor="middle">1 slave port</text>
<text x="845" y="520" font-size="10.5" fill="#d3ebe5" text-anchor="middle">27 master ports</text>
<path d="M730,320 L760,320 L760,400 L788,400" fill="none" stroke="#1b2430" stroke-width="2" marker-end="url(#ar)"/>
<text x="755" y="440" font-size="10" fill="#2f7566" text-anchor="end">link.main_to_peri</text>
<g font-size="11">
 <rect x="930" y="360" width="130" height="34" rx="5" fill="#fff" stroke="#2f7566"/><text x="995" y="381" text-anchor="middle">u_dev_* &times;27</text>
</g>
<line x1="900" y1="377" x2="928" y2="377" stroke="#1b2430" stroke-width="2" marker-end="url(#ar)"/>
<text x="995" y="412" font-size="10.5" fill="#5b6675" text-anchor="middle">uart0-3, gpio, i2c0-2,</text>
<text x="995" y="426" font-size="10.5" fill="#5b6675" text-anchor="middle">rv_timer, spi_device,</text>
<text x="995" y="440" font-size="10.5" fill="#5b6675" text-anchor="middle">AON: pwrmgr, rstmgr,</text>
<text x="995" y="454" font-size="10.5" fill="#5b6675" text-anchor="middle">clkmgr, pinmux, aon_timer,</text>
<text x="995" y="468" font-size="10.5" fill="#5b6675" text-anchor="middle">otp, lc, alert_handler,</text>
<text x="995" y="482" font-size="10.5" fill="#5b6675" text-anchor="middle">ret. SRAM, ast, ...</text>
